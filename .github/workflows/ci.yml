name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-slim
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate, test, build, and enforce draft-week freshness
        if: vars.DRAFT_REFRESH_ENABLED != 'false'
        run: npm run draft:ready
      - name: Validate, test, and build after draft season
        if: vars.DRAFT_REFRESH_ENABLED == 'false'
        run: npm run check
